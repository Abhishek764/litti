# Litti in Docker — for a team server. For personal use on your own machine,
# use `npm install -g litti && litti` instead (no setup, keys are created for you).
#
#   cp .env.example .env    # then set, at least:
#     SECRET_KEY=…          # 32+ random chars (node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
#     LITTI_API_KEY=…       # agents send it as x-litti-key; required because the container listens on 0.0.0.0
#     LITTI_ADMIN_KEY=…     # issues review links; keep it away from agents
#     PUBLIC_URL=https://litti.yourco.com   # what review links point to
#     TRUST_PROXY=true  LITTI_IDENTITY_HEADER=x-forwarded-email   # reviewers sign in through your SSO proxy
#   docker compose up -d
#
# The port is published on 127.0.0.1 only: put your https reverse proxy / SSO proxy on this host in
# front of it. Only change the binding to "3847:3847" if a firewall already limits who can reach it.
# Guide: docs/guide/team-setup.md
services:
  litti:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - "127.0.0.1:3847:3847"
    volumes:
      - litti-data:/data
volumes:
  litti-data:
