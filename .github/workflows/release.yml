name: Release
# Push a tag vX.Y.Z (or vX.Y.Z-rc.N) that matches package.json's version.
# Publishes to npm with provenance (Trusted Publishing, no NPM_TOKEN), creates a GitHub
# release with the tarball, SHA256SUMS and a CycloneDX SBOM, and pushes a multi-arch image
# to ghcr.io/abhishek764/litti. Pre-release tags (with a "-") go to npm dist-tag "next".
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11 (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@11.21.3
      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then echo "::error::tag $TAG does not match package.json version $VERSION"; exit 1; fi
      - run: npm ci
      - name: Pack, checksum, SBOM
        run: |
          npm pack
          sha256sum litti-*.tgz > SHA256SUMS
          npm sbom --omit dev --sbom-format cyclonedx > litti.cdx.json
          cat SHA256SUMS
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          DIST_TAG=latest
          case "$TAG" in *-*) DIST_TAG=next ;; esac
          # The very first version is published by hand (Trusted Publishing can only be set up
          # once the package exists). Re-running for an already published version skips npm.
          if [ -n "$(npm view "litti@${TAG#v}" version 2>/dev/null)" ]; then
            echo "::notice::litti@${TAG#v} is already on npm; skipping npm publish"; exit 0
          fi
          npm publish litti-*.tgz --provenance --access public --tag "$DIST_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            litti-*.tgz
            SHA256SUMS
            litti.cdx.json
          if-no-files-found: error

  image:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/abhishek764/litti
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true

  github-release:
    needs: [npm, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" litti-*.tgz SHA256SUMS litti.cdx.json --verify-tag --generate-notes --title "Litti $TAG" $PRE
