<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Litti — Receipt Chain</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--text-muted:#8b949e;
  --green:#3fb950;--red:#f85149;--yellow:#d29922;--orange:#db6d28;--blue:#58a6ff;
  --font-mono:'SF Mono','Cascadia Code','Fira Code',monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:24px;margin:0 0 2px;letter-spacing:.5px}
.sub{color:var(--text-muted);font-size:14px;margin-bottom:24px}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
button{background:var(--blue);color:#06101f;border:0;border-radius:8px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .08s}
button:active{transform:scale(.97)}
button.danger{background:transparent;color:var(--red);border:1px solid var(--red);font-size:12px;padding:8px 14px}
.grid{display:grid;grid-template-columns:1fr 300px;gap:20px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;position:relative}
.rowtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-weight:700;font-size:11px;color:#0d1117;letter-spacing:1px}
.outcome{font-size:12px;font-weight:700;letter-spacing:.5px}
.hash{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:8px;word-break:break-all}
.desc{margin:8px 0 4px;font-size:14px}
.bar{height:8px;border-radius:4px;background:#0a0d12;overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;transition:width .4s}
.barlabel{font-size:11px;color:var(--text-muted);margin-top:4px}
.check{position:absolute;right:14px;top:14px;font-size:20px;opacity:0;transition:opacity .2s}
.panel h2{font-size:14px;letter-spacing:1px;color:var(--text-muted);margin:0 0 10px}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}
.stat b{font-family:var(--font-mono)}
#verifyResult{font-weight:700;margin-left:12px}
.flash{animation:flash .5s}
@keyframes flash{0%{background:#3a1a1a}100%{background:var(--surface)}}
.empty{color:var(--text-muted);font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔒 LITTI</h1>
  <div class="sub">Hash-chained receipts. Tamper with one and the chain breaks.</div>

  <div class="toolbar">
    <button id="verify">Verify Chain</button>
    <span id="verifyResult"></span>
    <button class="danger" id="break" style="margin-left:auto">Break Chain (Demo)</button>
  </div>

  <div class="grid">
    <div id="receipts"><div class="empty">Loading receipts…</div></div>
    <div class="panel">
      <div class="card">
        <h2>REVIEWERS</h2>
        <div id="stats"><div class="empty">No data yet.</div></div>
      </div>
    </div>
  </div>
</div>

<script>
function scoreColor(s){return s<30?'var(--red)':s<70?'var(--yellow)':'var(--green)';}
const TIER={0:['AUTO','var(--green)'],1:['LOW','var(--yellow)'],2:['HIGH','var(--orange)'],3:['CRITICAL','var(--red)']};
const OUTCOME={'approved':'var(--green)','rejected':'var(--red)','rubber-stamped':'var(--red)','auto-approved':'var(--blue)'};

async function load(){
  try{
    const [receipts,stats]=await Promise.all([
      fetch('/api/receipts').then(r=>r.json()),
      fetch('/api/stats').then(r=>r.json())
    ]);
    renderReceipts(receipts);
    renderStats(stats);
  }catch(e){
    console.error('Load failed:',e);
    document.getElementById('receipts').innerHTML='<div class="empty">Failed to load — is the server running?</div>';
  }
}

function renderReceipts(list){
  const el=document.getElementById('receipts');
  if(!list.length){el.innerHTML='<div class="empty">No receipts yet. Run the demo.</div>';return;}
  el.innerHTML=list.map(r=>{
    const [tlabel,tcolor]=TIER[r.tier]||['?','var(--text-muted)'];
    const oc=OUTCOME[r.outcome]||'var(--text-muted)';
    return `<div class="card" data-id="${r.id}">
      <span class="check" id="chk-${r.id}"></span>
      <div class="rowtop">
        <span class="badge" style="background:${tcolor}">TIER ${r.tier} · ${tlabel}</span>
        <span class="outcome" style="color:${oc}">${r.outcome.toUpperCase()}</span>
      </div>
      <div class="desc">${escapeHtml(r.actionCard.description)}</div>
      <div class="bar"><i style="width:${r.attentionScore}%;background:${scoreColor(r.attentionScore)}"></i></div>
      <div class="barlabel">Attention score: ${r.attentionScore}/100 · approvers: ${r.approvals.map(a=>escapeHtml(a.approver)).join(', ')||'—'}</div>
      <div class="hash">chain: ${r.chainHash}</div>
    </div>`;
  }).join('');
}

function renderStats(list){
  const el=document.getElementById('stats');
  if(!list.length){el.innerHTML='<div class="empty">No data yet.</div>';return;}
  el.innerHTML=list.map(s=>`
    <div class="stat"><span>${escapeHtml(s.approver)}</span><b style="color:${scoreColor(s.avgAttention)}">${escapeHtml(s.avgAttention)}</b></div>
    <div class="barlabel">rubber-stamps: ${escapeHtml(s.rubberStampCount)} · approval rate: ${escapeHtml(s.approvalRate)}%</div>
  `).join('');
}

function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

document.getElementById('verify').addEventListener('click',async()=>{
  const out=document.getElementById('verifyResult');
  out.textContent='';out.style.color='';
  let results;
  try{results=await fetch('/api/chain/verify').then(r=>r.json());}
  catch(e){console.error(e);out.textContent='Verify failed';out.style.color='var(--red)';return;}
  if(!results.length){out.textContent='Empty chain.';return;}
  let allOk=true;
  for(let i=0;i<results.length;i++){
    const r=results[i];
    const chk=document.getElementById('chk-'+r.id);
    await new Promise(res=>setTimeout(res,200));
    if(chk){chk.textContent=r.valid?'✅':'❌';chk.style.opacity='1';}
    if(!r.valid){
      allOk=false;
      const card=document.querySelector('.card[data-id="'+r.id+'"]');
      if(card){card.classList.add('flash');card.style.borderColor='var(--red)';}
      break;
    }
  }
  out.textContent=allOk?'✅ Chain intact':'❌ Chain broken';
  out.style.color=allOk?'var(--green)':'var(--red)';
});

document.getElementById('break').addEventListener('click',async()=>{
  document.querySelectorAll('.check').forEach(c=>c.style.opacity='0');
  const out=document.getElementById('verifyResult');
  try{
    const res=await fetch('/api/demo/break-chain',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(r=>r.json());
    out.textContent=res.message;out.style.color=res.ok?'var(--yellow)':'var(--red)';
    await load();
  }catch(e){console.error(e);out.textContent='Break failed';out.style.color='var(--red)';}
});

load();
</script>
</body>
</html>
