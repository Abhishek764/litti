version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # 13.x has no prebuilt binary for Windows + Node 22 (install falls back to node-gyp and fails).
      # Re-enable once its release assets cover every Node version and OS that Litti supports.
      - dependency-name: better-sqlite3
        versions: ['>=13.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
